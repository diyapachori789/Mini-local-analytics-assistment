name: CI/CD

# Pull requests run the tests only. A push to main that passes them builds an
# image, publishes it, and deploys it to EC2.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  # Never cancel a running deploy. DuckDB allows one writer, so a half-finished
  # container swap is worse than waiting for the previous run to finish.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # ghcr.io requires a lowercase path; metadata-action lowercases this for us.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Tests. No GROQ_API_KEY is provided on purpose: the suite is fully offline
  #    and tests/conftest.py blocks the API client for anything not marked
  #    `live`, so a test that tries to reach Groq fails here rather than
  #    silently spending quota.
  # ---------------------------------------------------------------------------
  test:
    name: Offline test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the offline suite
        env:
          MPLBACKEND: Agg
        run: pytest -q

      - name: Fail if a secret was committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git. Remove it and rotate the key."
            exit 1
          fi
          if git ls-files | grep -qiE '\.pem$|id_rsa$'; then
            echo "::error::A private key is tracked by git."
            exit 1
          fi
          echo "No .env or private key is tracked."

  # ---------------------------------------------------------------------------
  # 2. Build and publish. Built here rather than on the server: t2.micro has one
  #    vCPU and 1 GB of RAM, and installing pandas/matplotlib/duckdb there is
  #    slow enough to risk an OOM kill. The runner has 4 vCPU and 16 GB.
  # ---------------------------------------------------------------------------
  build:
    name: Build and publish image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Built-in token; no secret to create for pushing.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache lives in the Actions cache, so an unchanged
          # requirements.txt skips the slow pip layer entirely.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin the deployed image to its digest
        id: pin
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # A digest, not a tag. `latest` can be overwritten; a digest cannot,
          # so a restart in three weeks runs exactly the code that was tested.
          IMAGE="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Deploying: $IMAGE"

  # ---------------------------------------------------------------------------
  # 3. Deploy over SSH. The server pulls the published image; no source code,
  #    no build, and no Docker Hub rate limit involved.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Without this the job's GITHUB_TOKEN carries no package scope, and the
      # registry rejects it. Harmless for a public package, which needs no
      # token at all, and required the moment the package is made private.
      packages: read
    # Optional: create an Environment named `production` in repo settings to
    # require a manual approval before this job runs.
    #
    # No `url:` here on purpose. GitHub resolves the environment before the
    # secrets context exists, so `${{ secrets.EC2_HOST }}` is not a valid value
    # for it. The deployed address is written to the run summary instead.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up the SSH key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Written via stdin, so the key never appears in a command line.
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          # Reject a key with the wrong format early: the usual cause is pasting
          # the .pem without its BEGIN/END lines or with CRLF endings.
          if ! ssh-keygen -y -f ~/.ssh/deploy.pem >/dev/null 2>&1; then
            echo "::error::EC2_SSH_KEY is not a readable private key. Paste the whole .pem, including the BEGIN and END lines."
            exit 1
          fi
          if [ -z "$EC2_HOST" ]; then
            echo "::error::EC2_HOST secret is empty. Set it to the instance's public IPv4."
            exit 1
          fi

          # Is the port even reachable? Asked first because every other failure
          # here looks the same from SSH, and this one has a specific fix.
          if ! timeout 12 bash -c "cat < /dev/null > /dev/tcp/${EC2_HOST}/22" 2>/dev/null; then
            echo "::error::Cannot reach ${EC2_HOST}:22 from this runner."
            echo "This runner is a GitHub-hosted machine in Azure, not your laptop, so a"
            echo "security group rule scoped to 'My IP' will not admit it."
            echo "Fix: EC2 > Security groups > Edit inbound rules > SSH (22)"
            echo "     source 0.0.0.0/0 (key-only auth is on by default on Amazon Linux),"
            echo "     or use AWS SSM Session Manager to avoid opening 22 at all."
            echo "Also confirm the instance is running and EC2_HOST matches its CURRENT"
            echo "public IPv4 - that address changes after every stop/start unless you"
            echo "attach an Elastic IP."
            exit 1
          fi
          echo "${EC2_HOST}:22 is reachable."

          if [ -n "$KNOWN_HOSTS" ]; then
            # Pinned host key: proves the box is the one you deployed to before.
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            # Non-empty is not the same as "contains a key for THIS host", and
            # only the second one makes ssh work. Checking the weaker property
            # is what let a stale pin through to an instant, unexplained
            # "Host key verification failed" in the next step.
            if ! ssh-keygen -F "$EC2_HOST" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
              echo "::error::EC2_KNOWN_HOSTS has no entry for ${EC2_HOST}."
              echo "It is probably pinned to an older IP. Either delete the secret to"
              echo "fall back to trust-on-first-use, or regenerate it with:"
              echo "  ssh-keyscan -H ${EC2_HOST}"
              exit 1
            fi
            echo "SSH_STRICT=yes" >> "$GITHUB_ENV"
            echo "Using the pinned host key."
          else
            # Trust on first use, performed by ssh itself. Deliberately not
            # ssh-keyscan: that put a second, separately-failing step between
            # us and the connection, and when it half-succeeded the error
            # surfaced later and pointed at the wrong thing. accept-new is the
            # same trust decision made in one place, by the client that
            # actually needs it.
            : > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            echo "SSH_STRICT=accept-new" >> "$GITHUB_ENV"
            echo "No pinned host key; accepting this host on first connection."
            echo "To pin it, run 'ssh-keyscan -H ${EC2_HOST}' and store the output"
            echo "as the EC2_KNOWN_HOSTS secret."
          fi

      - name: Copy the compose file and deploy script
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          # BatchMode stops ssh waiting on a prompt no one can answer, and the
          # timeout turns an unreachable host into a fast, legible failure
          # instead of a job that hangs until it is cancelled.
          ssh -i ~/.ssh/deploy.pem -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking="${SSH_STRICT:-accept-new}" \
            "$EC2_USER@$EC2_HOST" 'mkdir -p ~/mini-local-analytics'
          scp -i ~/.ssh/deploy.pem -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking="${SSH_STRICT:-accept-new}" \
            docker-compose.prod.yml scripts/deploy.sh \
            "$EC2_USER@$EC2_HOST:~/mini-local-analytics/"

      - name: Write the runtime environment file
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APP_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          # Piped over stdin rather than passed as arguments: an argument would
          # be visible in `ps` to any other user on the box.
          {
            printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY"
            printf 'APP_IMAGE=%s\n' "$APP_IMAGE"
          } | ssh -i ~/.ssh/deploy.pem -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking="${SSH_STRICT:-accept-new}" \
              "$EC2_USER@$EC2_HOST" \
              'umask 077 && cat > ~/mini-local-analytics/.env && echo "wrote .env ($(wc -l < ~/mini-local-analytics/.env) lines)"'

      - name: Deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          REGISTRY_USER: ${{ github.actor }}
          # A PAT with read:packages, needed only while the package is private.
          # Falls back to the job token, which works for a public package.
          REGISTRY_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # tee lets the log stream live AND be read back afterwards. pipefail
          # is required with it: without it the pipeline reports tee's exit
          # status, so a failed deploy would be recorded as a success.
          set -o pipefail

          # The script is already on the server, so stdin is free to carry the
          # registry token. Piping the script in instead would collide: the
          # docker login would eat the rest of it.
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy.pem \
            -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking="${SSH_STRICT:-accept-new}" "$EC2_USER@$EC2_HOST" \
            "REGISTRY_USER='$REGISTRY_USER' bash ~/mini-local-analytics/deploy.sh" \
            | tee /tmp/deploy.log

          # The server knows which port it actually published; the runner does
          # not. Reading it back keeps the summary link honest when the compose
          # file changes.
          PORT=$(grep -oE 'DEPLOYED_PORT=[0-9]+' /tmp/deploy.log | tail -1 | cut -d= -f2)
          echo "DEPLOYED_PORT=${PORT:-8000}" >> "$GITHUB_ENV"

      - name: Summarise the deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          APP_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          # Port 80 is the default for http, so showing it would be noise.
          if [ "${DEPLOYED_PORT}" = "80" ]; then
            URL="http://${EC2_HOST}"
          else
            URL="http://${EC2_HOST}:${DEPLOYED_PORT}"
          fi
          {
            echo "### Deployed"
            echo ""
            echo "- URL: ${URL}"
            echo "- Image: \`${APP_IMAGE}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key from the runner
        if: always()
        run: shred -u ~/.ssh/deploy.pem 2>/dev/null || rm -f ~/.ssh/deploy.pem
